<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#080912"
    >

    <meta
        name="color-scheme"
        content="dark"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="format-detection"
        content="telephone=no"
    >

    <title>IQ TEST BOT</title>

    <!--
        Telegram Mini App SDK.
        Must load before app.js.
    -->
    <script
        src="https://telegram.org/js/telegram-web-app.js"
    ></script>

    <!--
        API base can be changed from the HTML without
        touching app.js.

        IMPORTANT:
        Leave empty when frontend and backend are served
        from the same domain.
    -->
    <script>
        window.IQ_TEST_BOT_API_BASE = "";
    </script>

    <link
        rel="stylesheet"
        href="/webapp/style.css"
    >
</head>

<body>

    <!--
        JavaScript creates the complete application UI
        inside this element.
    -->
    <main id="app">
        <section class="initial-loading-screen">
            <div class="initial-loading-brain">
                🧠
            </div>

            <div class="initial-loading-brand">
                IQ TEST BOT
            </div>

            <div class="initial-loading-spinner"></div>

            <div class="initial-loading-text">
                Yuklanmoqda...
            </div>
        </section>
    </main>

    <!--
        Main application.
        Payment logic is also inside app.js.
        Separate payment.js is NOT required.
    -->
    <script
        src="/webapp/app.js"
        defer
    ></script>

    <noscript>
        <div
            style="
                min-height:100vh;
                display:flex;
                align-items:center;
                justify-content:center;
                padding:24px;
                background:#080912;
                color:#fff;
                font-family:Arial,sans-serif;
                text-align:center;
            "
        >
            IQ TEST BOT ishlashi uchun JavaScript yoqilgan
            bo‘lishi kerak.
        </div>
    </noscript>

</body>
</html>
